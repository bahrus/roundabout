<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Hitch Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="target">Testing...</div>
    <button id="testButton">Click Me</button>
    <div id="log"></div>
    
    <script type="module">
        const target = document.getElementById('target');
        const button = document.getElementById('testButton');
        const log = document.getElementById('log');
        
        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            log.appendChild(p);
            console.log(msg);
        }

        try {
            addLog('Starting basic hitch test...');
            
            const { roundabout } = await import('../../index.js');
            addLog('Imported roundabout');

            // Create view model with element, event type, and counter
            const myObject = {
                myButton: button,
                eventName: 'click',
                clickCount: 0
            };

            addLog('Created myObject');
            addLog(`Initial clickCount: ${myObject.clickCount}`);

            const [vm, propagator] = await roundabout({
                vm: myObject,
                propagate: ['clickCount'],
                hitch: {
                    when_myButton_emits_eventName_inc_clickCount_by: 1
                }
            });

            addLog('Roundabout initialized');
            addLog(`After init clickCount: ${vm.clickCount}`);

            // Simulate button clicks
            addLog('Simulating button click...');
            button.click();
            
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After 1 click: clickCount = ${vm.clickCount}`);

            button.click();
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After 2 clicks: clickCount = ${vm.clickCount}`);

            button.click();
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After 3 clicks: clickCount = ${vm.clickCount}`);

            // Verify
            if (vm.clickCount === 3) {
                target.setAttribute('mark', 'good');
                target.textContent = `✓ Test passed! clickCount = ${vm.clickCount}`;
                addLog('TEST PASSED');
            } else {
                target.setAttribute('mark', 'bad');
                target.textContent = `✗ Test failed! Expected clickCount=3, got ${vm.clickCount}`;
                addLog('TEST FAILED');
            }
        } catch (error) {
            addLog(`ERROR: ${error.message}`);
            addLog(`Stack: ${error.stack}`);
            target.setAttribute('mark', 'bad');
            target.textContent = `✗ Error: ${error.message}`;
        }
    </script>
</body>
</html>
