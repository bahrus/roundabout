<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Increment Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="target">Testing...</div>
    <div id="log"></div>
    
    <script type="module">
        const log = document.getElementById('log');
        const target = document.getElementById('target');
        
        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            log.appendChild(p);
            console.log(msg);
        }

        try {
            addLog('Starting increment test...');
            
            const { roundabout } = await import('../../index.js');
            addLog('Imported roundabout');

            const myObject = {
                age: 25,
                ageChangeCount: 0
            };

            addLog('Created myObject');

            const [vm, propagator] = await roundabout({
                vm: myObject,
                compacts: {
                    when_age_changes_inc_ageChangeCount_by: 1
                }
            });

            addLog('Roundabout initialized');
            addLog(`Initial: age=${vm.age}, ageChangeCount=${vm.ageChangeCount}`);
            
            // Test: Change age multiple times and verify counter increments
            vm.age = 26;
            addLog(`Changed age to: ${vm.age}`);
            
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After first change: ageChangeCount=${vm.ageChangeCount}`);
            
            vm.age = 27;
            addLog(`Changed age to: ${vm.age}`);
            
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After second change: ageChangeCount=${vm.ageChangeCount}`);
            
            vm.age = 28;
            addLog(`Changed age to: ${vm.age}`);
            
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After third change: ageChangeCount=${vm.ageChangeCount}`);
            
            if (vm.ageChangeCount === 3) {
                target.setAttribute('mark', 'good');
                target.textContent = `✓ Test passed! Counter correctly incremented to ${vm.ageChangeCount}`;
                addLog('TEST PASSED');
            } else {
                target.setAttribute('mark', 'bad');
                target.textContent = `✗ Test failed! Expected ageChangeCount=3, got ${vm.ageChangeCount}`;
                addLog('TEST FAILED');
            }
        } catch (error) {
            addLog(`ERROR: ${error.message}`);
            addLog(`Stack: ${error.stack}`);
            target.setAttribute('mark', 'bad');
            target.textContent = `✗ Error: ${error.message}`;
        }
    </script>
</body>
</html>
