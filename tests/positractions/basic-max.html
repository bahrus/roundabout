<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positraction - Basic Math.max Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="target">Testing...</div>
    <div id="log"></div>
    
    <script type="module">
        const target = document.getElementById('target');
        const log = document.getElementById('log');
        
        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            log.appendChild(p);
            console.log(msg);
        }

        try {
            addLog('Starting basic positraction test...');
            
            const { roundabout } = await import('../../index.js');
            addLog('Imported roundabout');

            // Create view model
            const myObject = {
                age: 25,
                heightInInches: 68,
                maxOfAgeAndHeightInInches: 0
            };

            addLog('Created myObject');
            addLog(`Initial: age=${myObject.age}, height=${myObject.heightInInches}`);

            const [vm, propagator] = await roundabout({
                vm: myObject,
                propagate: ['age', 'heightInInches', 'maxOfAgeAndHeightInInches'],
                positractions: [
                    {
                        ifKeyIn: ['age', 'heightInInches'],
                        do: Math.max,
                        assignTo: ['maxOfAgeAndHeightInInches']
                    }
                ]
            });

            addLog('Roundabout initialized');
            addLog(`After init: max=${vm.maxOfAgeAndHeightInInches}`);

            // Verify initial calculation
            if (vm.maxOfAgeAndHeightInInches !== 68) {
                throw new Error(`Initial calculation failed: expected 68, got ${vm.maxOfAgeAndHeightInInches}`);
            }

            // Change age to be larger
            addLog('Changing age to 75...');
            vm.age = 75;
            
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After age change: max=${vm.maxOfAgeAndHeightInInches}`);

            // Verify
            if (vm.maxOfAgeAndHeightInInches === 75) {
                target.setAttribute('mark', 'good');
                target.textContent = `✓ Test passed! max = ${vm.maxOfAgeAndHeightInInches}`;
                addLog('TEST PASSED');
            } else {
                target.setAttribute('mark', 'bad');
                target.textContent = `✗ Test failed! Expected max=75, got ${vm.maxOfAgeAndHeightInInches}`;
                addLog('TEST FAILED');
            }
        } catch (error) {
            addLog(`ERROR: ${error.message}`);
            addLog(`Stack: ${error.stack}`);
            target.setAttribute('mark', 'bad');
            target.textContent = `✗ Error: ${error.message}`;
        }
    </script>
</body>
</html>
