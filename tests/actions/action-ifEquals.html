<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action ifEquals Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="target">Testing...</div>
    <div id="log"></div>
    
    <script type="module">
        const log = document.getElementById('log');
        const target = document.getElementById('target');
        
        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            log.appendChild(p);
            console.log(msg);
        }

        try {
            addLog('Starting ifEquals action test...');
            
            const { roundabout } = await import('../../index.js');
            addLog('Imported roundabout');

            const myObject = {
                password: '',
                confirmPassword: '',
                passwordsMatch: false,
                
                checkPasswordMatch(self, context) {
                    addLog(`checkPasswordMatch called! Changed: ${context.changedProperty}`);
                    return {
                        passwordsMatch: true
                    };
                }
            };

            addLog('Created myObject');

            const [vm, propagator] = await roundabout({
                vm: myObject,
                actions: {
                    checkPasswordMatch: {
                        ifEquals: ['password', 'confirmPassword']
                    }
                }
            });

            addLog('Roundabout initialized');
            addLog(`Initial: passwordsMatch=${vm.passwordsMatch}`);
            
            // Set password
            vm.password = 'secret123';
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After password: passwordsMatch=${vm.passwordsMatch}`);
            
            // Set confirmPassword to different value - should not trigger
            vm.confirmPassword = 'different';
            vm.passwordsMatch = false; // Reset
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After confirmPassword (different): passwordsMatch=${vm.passwordsMatch}`);
            
            // Set confirmPassword to matching value - should trigger
            vm.confirmPassword = 'secret123';
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After confirmPassword (matching): passwordsMatch=${vm.passwordsMatch}`);
            
            if (vm.passwordsMatch === true) {
                target.setAttribute('mark', 'good');
                target.textContent = `✓ Test passed! Passwords matched`;
                addLog('TEST PASSED');
            } else {
                target.setAttribute('mark', 'bad');
                target.textContent = `✗ Test failed! Expected passwordsMatch=true, got ${vm.passwordsMatch}`;
                addLog('TEST FAILED');
            }
        } catch (error) {
            addLog(`ERROR: ${error.message}`);
            addLog(`Stack: ${error.stack}`);
            target.setAttribute('mark', 'bad');
            target.textContent = `✗ Error: ${error.message}`;
        }
    </script>
</body>
</html>
