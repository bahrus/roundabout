<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Conflict Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="target">Testing...</div>
    <div id="log"></div>
    
    <script type="module">
        const log = document.getElementById('log');
        const target = document.getElementById('target');
        
        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            log.appendChild(p);
            console.log(msg);
        }

        try {
            addLog('Starting conflict detection test...');
            
            const { roundabout } = await import('../../index.js');
            addLog('Imported roundabout');

            const myObject = {
                age: 25,
                partyCount: 0,
                
                throwBirthdayParty(self) {
                    return {
                        partyCount: self.partyCount + 1
                    };
                }
            };

            addLog('Created myObject');

            // This should throw an error because throwBirthdayParty is used by both compact and action
            try {
                const [vm, propagator] = await roundabout({
                    vm: myObject,
                    compacts: {
                        when_age_changes_call_throwBirthdayParty: 0
                    },
                    actions: {
                        throwBirthdayParty: {
                            ifAllOf: ['age']
                        }
                    }
                });
                
                // Should not reach here
                target.setAttribute('mark', 'bad');
                target.textContent = `✗ Test failed! Expected error but roundabout initialized successfully`;
                addLog('TEST FAILED - No error thrown');
            } catch (error) {
                addLog(`Caught expected error: ${error.message}`);
                
                if (error.message.includes('Conflict detected') && error.message.includes('throwBirthdayParty')) {
                    target.setAttribute('mark', 'good');
                    target.textContent = `✓ Test passed! Conflict correctly detected`;
                    addLog('TEST PASSED');
                } else {
                    target.setAttribute('mark', 'bad');
                    target.textContent = `✗ Test failed! Wrong error: ${error.message}`;
                    addLog('TEST FAILED - Wrong error');
                }
            }
        } catch (error) {
            addLog(`ERROR: ${error.message}`);
            addLog(`Stack: ${error.stack}`);
            target.setAttribute('mark', 'bad');
            target.textContent = `✗ Error: ${error.message}`;
        }
    </script>
</body>
</html>
