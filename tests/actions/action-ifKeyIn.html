<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action ifKeyIn Test</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div id="target">Testing...</div>
    <div id="log"></div>
    
    <script type="module">
        const log = document.getElementById('log');
        const target = document.getElementById('target');
        
        function addLog(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            log.appendChild(p);
            console.log(msg);
        }

        try {
            addLog('Starting ifKeyIn action test...');
            
            const { roundabout } = await import('../../index.js');
            addLog('Imported roundabout');

            const myObject = {
                width: 10,
                height: 20,
                depth: 30,
                volume: 0,
                callCount: 0,
                
                calculateVolume(self, context) {
                    addLog(`calculateVolume called! Changed: ${context.changedProperty}`);
                    return {
                        volume: self.width * self.height * self.depth,
                        callCount: self.callCount + 1
                    };
                }
            };

            addLog('Created myObject');

            const [vm, propagator] = await roundabout({
                vm: myObject,
                actions: {
                    calculateVolume: {
                        ifKeyIn: ['width', 'height', 'depth']
                    }
                }
            });

            addLog('Roundabout initialized');
            addLog(`Initial: volume=${vm.volume}, callCount=${vm.callCount}`);
            
            // Change width - should trigger
            vm.width = 15;
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After width change: volume=${vm.volume}, callCount=${vm.callCount}`);
            
            // Change height - should trigger again
            vm.height = 25;
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After height change: volume=${vm.volume}, callCount=${vm.callCount}`);
            
            // Change depth - should trigger again
            vm.depth = 35;
            await new Promise(resolve => setTimeout(resolve, 100));
            addLog(`After depth change: volume=${vm.volume}, callCount=${vm.callCount}`);
            
            // Should have been called 4 times (initial + 3 changes)
            if (vm.callCount === 4 && vm.volume === 15 * 25 * 35) {
                target.setAttribute('mark', 'good');
                target.textContent = `✓ Test passed! Called ${vm.callCount} times, volume=${vm.volume}`;
                addLog('TEST PASSED');
            } else {
                target.setAttribute('mark', 'bad');
                target.textContent = `✗ Test failed! Expected callCount=4, got ${vm.callCount}`;
                addLog('TEST FAILED');
            }
        } catch (error) {
            addLog(`ERROR: ${error.message}`);
            addLog(`Stack: ${error.stack}`);
            target.setAttribute('mark', 'bad');
            target.textContent = `✗ Error: ${error.message}`;
        }
    </script>
</body>
</html>
