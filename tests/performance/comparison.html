<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Comparison - Internal Routing vs Traditional</title>
    <!-- #include virtual="/imports.html" -->
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .comparison { display: flex; gap: 20px; margin: 20px 0; }
        .test-result { flex: 1; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        .test-result.winner { background-color: #e8f5e9; border-color: #4caf50; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f5f5f5; }
        .metric-value { font-weight: bold; }
        .improvement { color: #4caf50; font-weight: bold; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Performance Comparison</h1>
    <div id="target">Testing...</div>
    <div id="status"></div>
    
    <div class="comparison">
        <div class="test-result" id="traditional-result">
            <h2>Traditional Approach</h2>
            <p>Uses assignGingerly with immediate event firing</p>
            <div id="traditional-metrics"></div>
        </div>
        
        <div class="test-result" id="internal-routing-result">
            <h2>Internal Routing</h2>
            <p>Batches changes and fires events at the end</p>
            <div id="internal-routing-metrics"></div>
        </div>
    </div>
    
    <div id="analysis"></div>
    
    <script type="module">
        const target = document.getElementById('target');
        const status = document.getElementById('status');
        
        function addStatus(msg) {
            const p = document.createElement('p');
            p.textContent = msg;
            status.appendChild(p);
            console.log(msg);
        }

        function showMetrics(containerId, metrics, label) {
            const container = document.getElementById(containerId);
            container.innerHTML += `
                <h3>Results</h3>
                <table>
                    <tr><th>Metric</th><th>Value</th></tr>
                    <tr><td>Total Time</td><td class="metric-value">${metrics.totalTime.toFixed(2)}ms</td></tr>
                    <tr><td>Action Invocations</td><td class="metric-value">${metrics.actionInvocations}</td></tr>
                    <tr><td>Avg Time per Action</td><td class="metric-value">${(metrics.totalTime / metrics.actionInvocations).toFixed(2)}ms</td></tr>
                </table>
            `;
        }

        function showComparison(traditional, internalRouting) {
            const timeDiff = traditional.totalTime - internalRouting.totalTime;
            const timeImprovement = ((timeDiff / traditional.totalTime) * 100).toFixed(1);
            const invocationDiff = traditional.actionInvocations - internalRouting.actionInvocations;
            
            // Highlight winner
            if (timeDiff > 0) {
                document.getElementById('internal-routing-result').classList.add('winner');
            } else {
                document.getElementById('traditional-result').classList.add('winner');
            }
            
            const analysis = document.getElementById('analysis');
            analysis.innerHTML = `
                <h2>Analysis</h2>
                <table>
                    <tr>
                        <th>Metric</th>
                        <th>Traditional</th>
                        <th>Internal Routing</th>
                        <th>Difference</th>
                    </tr>
                    <tr>
                        <td>Total Time</td>
                        <td>${traditional.totalTime.toFixed(2)}ms</td>
                        <td>${internalRouting.totalTime.toFixed(2)}ms</td>
                        <td class="${timeDiff > 0 ? 'improvement' : ''}">${timeDiff > 0 ? '-' : '+'}${Math.abs(timeDiff).toFixed(2)}ms (${timeImprovement}%)</td>
                    </tr>
                    <tr>
                        <td>Action Invocations</td>
                        <td>${traditional.actionInvocations}</td>
                        <td>${internalRouting.actionInvocations}</td>
                        <td class="${invocationDiff > 0 ? 'improvement' : ''}">${invocationDiff > 0 ? '-' : '+'}${Math.abs(invocationDiff)}</td>
                    </tr>
                </table>
                <h3>Conclusion</h3>
                <p>${timeDiff > 0 
                    ? `Internal routing is <strong>${timeImprovement}% faster</strong> than the traditional approach.`
                    : `Traditional approach is <strong>${Math.abs(parseFloat(timeImprovement))}% faster</strong> than internal routing.`
                }</p>
                <p>Action invocations: ${invocationDiff > 0 
                    ? `Internal routing reduced invocations by ${invocationDiff}.`
                    : `Both approaches had similar invocation counts.`
                }</p>
            `;
        }

        async function runTest(useInternalRouting, label) {
            addStatus(`\nRunning ${label}...`);
            
            const metrics = {
                actionInvocations: 0,
                totalTime: 0
            };

            // Create test object
            const myObject = {
                a: 1,
                b: 2,
                sum: 0,
                double: 0,
                final: 0,
                
                calculateSum(self) {
                    metrics.actionInvocations++;
                    return { sum: self.a + self.b };
                },
                
                calculateDouble(self) {
                    metrics.actionInvocations++;
                    return { double: self.sum * 2 };
                },
                
                calculateFinal(self) {
                    metrics.actionInvocations++;
                    return { final: self.double + 10 };
                }
            };

            const { roundabout } = await import('../../index.js');
            
            const [vm, propagator] = await roundabout({
                vm: myObject,
                actions: {
                    calculateSum: { ifKeyIn: ['a', 'b'] },
                    calculateDouble: { ifKeyIn: ['sum'] },
                    calculateFinal: { ifKeyIn: ['double'] }
                },
                internalRouting: useInternalRouting
            });

            // Wait for initial evaluation
            await new Promise(resolve => setTimeout(resolve, 100));

            addStatus(`${label}: Initial values - final=${vm.final}`);

            // Run the cascade multiple times for better measurement
            const iterations = 10;
            const times = [];
            
            for (let i = 0; i < iterations; i++) {
                const start = performance.now();
                
                vm.a = 10 + i;
                await new Promise(resolve => setTimeout(resolve, 50));
                
                vm.b = 20 + i;
                await new Promise(resolve => setTimeout(resolve, 100));
                
                const end = performance.now();
                times.push(end - start);
            }

            // Calculate average time
            metrics.totalTime = times.reduce((a, b) => a + b, 0) / iterations;

            addStatus(`${label}: Completed ${iterations} iterations`);
            addStatus(`${label}: Average time = ${metrics.totalTime.toFixed(2)}ms`);
            addStatus(`${label}: Total action invocations = ${metrics.actionInvocations}`);
            addStatus(`${label}: Final value = ${vm.final}`);

            return metrics;
        }

        try {
            addStatus('Starting performance comparison...');
            
            // Run traditional approach
            const traditionalMetrics = await runTest(false, 'Traditional');
            showMetrics('traditional-metrics', traditionalMetrics, 'Traditional');
            
            // Wait a bit between tests
            await new Promise(resolve => setTimeout(resolve, 500));
            
            // Run internal routing approach
            const internalRoutingMetrics = await runTest(true, 'Internal Routing');
            showMetrics('internal-routing-metrics', internalRoutingMetrics, 'Internal Routing');
            
            // Show comparison
            showComparison(traditionalMetrics, internalRoutingMetrics);
            
            target.setAttribute('mark', 'good');
            target.textContent = '✓ Performance comparison complete';
            addStatus('\nTEST PASSED');
        } catch (error) {
            addStatus(`ERROR: ${error.message}`);
            addStatus(`Stack: ${error.stack}`);
            target.setAttribute('mark', 'bad');
            target.textContent = `✗ Error: ${error.message}`;
        }
    </script>
</body>
</html>
